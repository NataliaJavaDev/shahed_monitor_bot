app:
  telegram:
    bot-token: "${BOT_TOKEN}"
    target-channel-id: "${TARGET_CHANNEL_ID}"
    debug-channel-id: "${DEBUG_CHANNEL_ID}"

  dictionary:
    file: data/dictionaries.json

  monitor:
    duplicate-ttl-minutes: 5
    context-ttl: 15m

  alert-api:
    base-url: https://api.ukrainealarm.com/api/v3
    api-key: ${UKRAINE_ALARM_API_KEY}
    alarm-region-id: ${ALARM_REGION_ID}
    high-risk-region-id: "711"
    polling-delay-ms: 30000

  tdlib:
    api-id: ${TDLIB_API_ID}
    api-hash: ${TDLIB_API_HASH}
    phone-number: ${TDLIB_PHONE_NUMBER}
    database-directory: tdlib-db
    files-directory: tdlib-files
    library-path: ${TDLIB_LIBRARY_PATH}
    auth-code: ${TDLIB_AUTH_CODE:}